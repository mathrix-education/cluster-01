apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: education-graphql
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - image: redis:5.0-alpine
          imagePullPolicy: Always
          name: php
          ports:
          - containerPort: 6379
              
