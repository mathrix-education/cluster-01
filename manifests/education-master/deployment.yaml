apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: education-graphql
  labels:
    app: api
spec:
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - image: eu.gcr.io/mathrix-education/education-api:7.0.0-719ad3f
          imagePullPolicy: Always
          name: php
          env:
          - name: APP_ENV
            value: v7
          envFrom:
          - configMapRef:
              name: env-configmap
          volumeMounts:
          - name: keychain-volume
            mountPath: /var/www/storage/keychain
      volumes:
        - name: keychain-volume
          configMap:
            name: keys
          
              
